[project]
name = "htp-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.116.1", "pydantic-settings==2.10.1", "uvicorn[standard]==0.35.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "mypy==1.17.1", "pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.7"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
